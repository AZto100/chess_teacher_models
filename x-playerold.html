<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Mate puzzles</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;--board-size:320px;background:#111827;color:#f3f4f6}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{height:100vh;height:100dvh;min-width:180px}
.app{height:100%;width:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(4px,env(safe-area-inset-top)) max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));gap:4px}
.top{display:flex;align-items:center;justify-content:center;gap:10px;min-height:29px;padding:1px 5px}
h1{font-size:clamp(13px,3.7vw,21px);font-weight:650;margin:0;line-height:1.2;text-wrap:balance}
.timer{font-variant-numeric:tabular-nums;font-size:clamp(13px,3.4vw,19px);font-weight:500;white-space:nowrap;color:#cbd5e1}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.board-shell{position:relative;width:var(--board-size);height:var(--board-size);flex:none}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);touch-action:manipulation;user-select:none;isolation:isolate}
.sq{appearance:none;margin:0;border:0;border-radius:0;padding:0;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden;cursor:pointer}
.sq.light{background:#eeeed2}.sq.dark{background:#769656}.sq.selected:after{content:"";position:absolute;inset:1px;border:3px solid #3185fb;pointer-events:none;z-index:3}
.sq:focus-visible{outline:3px solid #1462dc;outline-offset:-3px;z-index:4}body[data-phase=defending] .sq{cursor:wait}
.coord{position:absolute;top:1px;left:2px;font-size:clamp(7px,calc(var(--board-size)*.019),12px);font-weight:600;color:#24342a;pointer-events:none;opacity:.7;z-index:2}
.piece{width:93%;height:93%;display:block;pointer-events:none;z-index:1;filter:drop-shadow(0 1px 1px #0003)}.piece.white{color:#fff;--piece-edge:#202020;--piece-detail:#202020}.piece.black{color:#080808;--piece-edge:#d5d9dd;--piece-detail:#e9edf1}
.piece-body{fill:currentColor;stroke:var(--piece-edge);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.piece-detail{fill:none;stroke:var(--piece-detail);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.piece-eye{fill:var(--piece-detail);stroke:none}
.toolbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:33px;white-space:nowrap}
button,select{font:inherit}button.action,select{background:#27364c;color:#fff;border:1px solid #5b6a80;border-radius:6px;font-size:14px;line-height:18px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:default}select{max-width:110px}
button:focus-visible,select:focus-visible{outline:2px solid #80b7ff;outline-offset:2px}
.feedback{position:absolute;top:9px;left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);padding:8px 14px;border-radius:7px;background:#111827f5;color:#f1f5f9;box-shadow:0 2px 8px #0005;z-index:10;font-size:16px;font-weight:650;text-align:center;pointer-events:none}
.feedback.correct{background:#104729f5;color:#e8fff0}.feedback.try-again{background:#4e2421f5;color:#fff0e9}.feedback.error{font-size:13px;font-weight:400;width:max-content}
.promotion{position:absolute;inset:0;background:#111827b5;display:flex;align-items:center;justify-content:center;z-index:12}.promotion-card{width:min(290px,90%);background:#1f2937;border:1px solid #66768e;border-radius:9px;padding:12px;text-align:center}.promotion-card strong{display:block;margin-bottom:9px}#promotion-options{display:grid;grid-template-columns:1fr 1fr;gap:6px}#promotion-options button{padding:10px 6px;background:#334155;color:white;border:1px solid #789;border-radius:5px}#promotion-cancel{margin-top:10px}
[hidden]{display:none!important}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:300px){.toolbar{gap:5px}.toolbar button.action,.toolbar select{font-size:12px;padding:5px 8px}.top{gap:7px;padding:0}h1{font-size:13px}.timer{font-size:12px}}
@media(max-height:300px){.app{gap:1px;padding:2px}.top{min-height:21px}h1,.timer{font-size:12px}.toolbar{min-height:25px}.toolbar button.action,.toolbar select{padding:2px 8px;font-size:12px}}
#collection{max-width:145px;min-width:0}#level{max-width:100px}.toolbar{flex-wrap:wrap;gap:6px}.toolbar button.action,.toolbar select{padding:5px 6px;font-size:13px}@media(max-width:360px){#collection{max-width:130px}.toolbar{gap:4px}.toolbar button.action,.toolbar select{padding:4px 5px}}

<body data-phase="loading">
<main class="app">
<header class="top"><h1 id="instruction">Loading puzzle...</h1><time class="timer" id="timer" aria-label="Elapsed time" aria-live="off">00:00</time></header>
<section class="stage" id="stage" aria-label="Puzzle playing area"><div class="board-shell">
<div class="board" id="board" role="group" aria-label="Chess puzzle" aria-busy="true"></div>
<div class="feedback" id="feedback" role="status" aria-live="polite">Loading...</div>
<div class="promotion" id="promotion" role="dialog" aria-modal="true" aria-labelledby="promotion-title" hidden><div class="promotion-card"><strong id="promotion-title">Promote pawn</strong><div id="promotion-options"></div><button type="button" id="promotion-cancel" class="action">Cancel</button></div></div>
</div></section>
<footer class="toolbar"><button type="button" onclick="window.location.href='./famous-games.html'">Select a game?</button><label><span class="visually-hidden">Puzzle collection</span><select id="collection" aria-label="Puzzle collection"><option value="tournaments">Tournament Games</option></select></label><label><span class="visually-hidden">Puzzle level</span><select id="level" aria-label="Puzzle level"><option value="1">Mate in 1</option><option value="2">Mate in 2</option><option value="3">Mate in 3</option><option value="4">Mate in 4</option><option value="5">Mate in 5</option><option value="6">Mate in 6</option></select></label><button class="action" id="undo" type="button" disabled>Undo</button><button class="action" id="next" type="button" disabled>Next</button><button class="action" id="retry" type="button" hidden>Retry</button></footer>
</main>

  "k": "<g class=\"piece-body\"><path d=\"M29 4h6v6h6v6h-6v8h-6v-8h-6v-6h6Z\"/><path d=\"M21 38c-3-6-10-9-10-17 0-8 11-10 17-1l4 7 4-7c6-9 17-7 17 1 0 8-7 11-10 17Z\"/><path d=\"M22 35h20l3 15H19Z\"/><path d=\"M17 48h30l7 9H10Z\"/></g><g class=\"piece-detail\"><path d=\"M32 26v9M23 40h18M17 53h30\"/></g>"
});
/* Compact mate puzzles. The only analysis/opponent engine is Stockfish 19 Lite.
   All puzzle outcomes are decided by actual legal checkmate, not a stored line.
   SPDX-License-Identifier: GPL-3.0-or-later */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const Rules = Chess960Rules.Chess960;
const NAMES = {p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'};
const ABORT = () => new DOMException('Search cancelled','AbortError');
const ENGINE_URL = new URL('engine/stockfish-19-lite-single.js', location.href);
const THINK_MS = [0,600,900,1200,1600,2000,2400];
class LiteEngine {
  constructor() {
    this.active=null; this.pending=null; this.phase='boot'; this.worker=null;
    this.ready=new Promise((resolve,reject)=>{this.resolveReady=resolve;this.rejectReady=reject;});
    // A handler is attached immediately, including when puzzle JSON loads slowly.
    this.ready.catch(()=>{});
    this.bootTimer=setTimeout(()=>this.fail(new Error('Stockfish Lite did not start.')),45000);
    try {
      this.worker=new Worker(ENGINE_URL);
      this.worker.onmessage=e=>String(e.data).split(/\r?\n/).forEach(line=>this.line(line.trim()));
      this.worker.onerror=()=>this.fail(new Error('Stockfish Lite could not load. Keep the matching JS and WASM in engine/.'));
      this.worker.onmessageerror=()=>this.fail(new Error('Stockfish Lite returned unreadable data.'));
      this.send('uci');
    } catch(e) { this.fail(e); }
  }
  send(s) { this.worker?.postMessage(s); }
  line(s) {
    if(this.phase==='dead')return;
    if(s.includes('CRITICAL ERROR')){this.fail(new Error('Stockfish rejected the puzzle position.'));return;}
    if(s==='uciok'&&this.phase==='boot') {
      this.phase='config';
      for(const option of ['Hash value 32','MultiPV value 1','Skill Level value 20','UCI_LimitStrength value false','UCI_Chess960 value true','Ponder value false'])this.send('setoption name '+option);
      this.send('isready');
    } else if(s==='readyok'&&this.phase==='config') {
      clearTimeout(this.bootTimer);this.phase='idle';this.resolveReady();this.pump();
    } else if(s==='readyok'&&this.phase==='preparing') {
      clearTimeout(this.prepareTimer);
      if(this.active.cancelled){this.active=null;this.phase='idle';this.pump();}
      else this.startSearch();
    } else if(s.startsWith('bestmove ')&&this.active&&this.phase==='search') {
      const job=this.active; this.active=null; clearTimeout(this.searchTimer);clearTimeout(this.stopTimer);
      this.phase='idle';
      if(!job.cancelled) {
        const move=s.split(/\s+/)[1];
        if(/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(move))job.resolve(move);
        else job.reject(new Error('Stockfish did not return a legal defensive move.'));
      }
      this.pump();
    }
  }
  async search(fen,moves,level) {
    await this.ready;
    if(this.phase==='dead')throw new Error('Stockfish Lite is unavailable.');
    return new Promise((resolve,reject)=>{
      if(this.pending)this.pending.reject(ABORT());
      this.pending={fen,moves:[...moves],level,resolve,reject,cancelled:false};
      if(this.active)this.stopActive();else this.pump();
    });
  }
  pump() {
    if(this.phase!=='idle'||!this.pending)return;
    const job=this.pending;this.pending=null;this.active=job;this.phase='preparing';
    this.send('ucinewgame');this.send('isready');
    this.prepareTimer=setTimeout(()=>this.fail(new Error('Stockfish Lite did not prepare the position.')),12000);
  }
  startSearch() {
    const job=this.active;this.phase='search';
    this.send('position fen '+job.fen+(job.moves.length?' moves '+job.moves.join(' '):''));
    this.send('go depth 28 movetime '+THINK_MS[job.level]);
    this.searchTimer=setTimeout(()=>{
      this.send('stop');
      this.stopTimer=setTimeout(()=>this.fail(new Error('Stockfish Lite stopped responding.')),2500);
    },THINK_MS[job.level]+10000);
  }
  stopActive() {
    if(!this.active||this.active.cancelled)return;
    this.active.cancelled=true;this.active.reject(ABORT());
    if(this.phase==='preparing')return;
    this.send('stop');
    // Do not reuse the worker until the old search's bestmove has been drained.
    clearTimeout(this.searchTimer);
    this.stopTimer=setTimeout(()=>this.fail(new Error('Stockfish Lite could not stop the previous search.')),5000);
  }
  cancel() { if(this.pending){this.pending.reject(ABORT());this.pending=null;}this.stopActive(); }
  fail(error) {
    if(this.phase==='dead')return;
    clearTimeout(this.bootTimer);clearTimeout(this.searchTimer);clearTimeout(this.stopTimer);clearTimeout(this.prepareTimer);
    this.phase='dead';this.rejectReady(error);
    this.pending?.reject(error);if(!this.active?.cancelled)this.active?.reject(error);
    this.pending=null;this.active=null;this.worker?.terminate();
  }
  destroy() { this.fail(ABORT()); }
}
let engine=new LiteEngine(),game=null,puzzle=null,pack=[],index=0,selected=null;
let phase='loading',version=0,resetTimer=null,feedbackTimer=null,promotionOptions=null;
let elapsed=0,startedAt=null,attackingMoves=0,loadLevel=1;
const packs=new Map(),puzzleAliases=new Map();
const defaultCollection={id:'tournaments',name:'Tournament Games',basePath:'puzzles/'};
let collections=[defaultCollection],selectedCollection='tournaments';
async function loadCollections(){
  try{
    const response=await fetch(new URL('puzzles/collections.json',location.href),{cache:'no-store'});
    if(!response.ok)throw new Error('Catalogue unavailable');
    const data=await response.json();
    if(!Array.isArray(data.collections))throw new Error('Invalid catalogue');
    const ids=new Set();
    const entries=data.collections.map(c=>{
      if(!/^[a-z0-9][a-z0-9_-]*$/.test(c.id)||ids.has(c.id)||typeof c.name!=='string'||typeof c.basePath!=='string')throw new Error('Invalid collection');
      const path=new URL(c.basePath,location.href);
      if(path.origin!==location.origin)throw new Error('Collection must be on this site');
      ids.add(c.id);return {id:c.id,name:c.name,basePath:path.href.endsWith('/')?path.href:path.href+'/'};
    });
    collections=entries.some(c=>c.id==='tournaments')?entries:[defaultCollection,...entries];
  }catch(error){console.warn('Using the default puzzle collection:',error.message);}
  const requested=new URLSearchParams(location.search).get('c');
  selectedCollection=collections.some(c=>c.id===requested)?requested:'tournaments';
  $('collection').replaceChildren();
  for(const c of collections){const option=document.createElement('option');option.value=c.id;option.textContent=c.name;$('collection').append(option);}
  $('collection').value=selectedCollection;
}

const uci=m=>m.from+m.to+(m.promotion||'');
const colour=c=>c==='w'?'White':'Black';
function timeNow(){return elapsed+(startedAt===null?0:performance.now()-startedAt);}
function tick(){const t=Math.floor(timeNow()/1000);$('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function startClock(){if(startedAt===null)startedAt=performance.now();tick();}
function stopClock(){if(startedAt!==null){elapsed+=performance.now()-startedAt;startedAt=null;}tick();}
function newClock(){elapsed=0;startedAt=null;tick();}
function setMessage(text,kind='neutral'){
  $('feedback').textContent=text;$('feedback').className='feedback '+kind;$('feedback').hidden=!text;
}
function clearTransient(){clearTimeout(resetTimer);clearTimeout(feedbackTimer);resetTimer=null;feedbackTimer=null;closePromotion();setMessage('');}
function invalidate(){version++;engine.cancel();selected=null;clearTransient();return version;}
function setPhase(value){phase=value;document.body.dataset.phase=value;$('board').setAttribute('aria-busy',String(value==='defending'||value==='loading'));renderControls();}
function renderControls(){
  $('undo').disabled=!game||game.history().length===0||phase==='loading';
  $('next').disabled=!puzzle||phase==='loading';
  $('collection').disabled=phase==='loading';
  $('retry').hidden=phase!=='error';
}
function renderBoard(){
  if(!game)return;
  const board=$('board');board.replaceChildren();
  const black=puzzle.attacker==='b';
  for(let row=0;row<8;row++)for(let col=0;col<8;col++){
    const file=black?7-col:col,rank=black?row+1:8-row;
    const sq=String.fromCharCode(97+file)+rank,pc=game.get(sq);
    const button=document.createElement('button');button.type='button';button.dataset.square=sq;
    button.className='sq '+((file+rank)%2===1?'light':'dark')+(selected===sq?' selected':'');
    button.setAttribute('aria-label',sq.toUpperCase()+(pc?' '+colour(pc.color)+' '+NAMES[pc.type]:''));
    button.setAttribute('aria-pressed',String(selected===sq));
    const coord=document.createElement('span');coord.className='coord';coord.textContent=sq;coord.setAttribute('aria-hidden','true');button.append(coord);
    if(pc){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 64 64');svg.setAttribute('class','piece '+(pc.color==='w'?'white':'black'));svg.setAttribute('aria-hidden','true');svg.innerHTML=PIECE_ARTWORK[pc.type];button.append(svg);}
    board.append(button);
  }
  renderControls();
}
function sizeBoard(){const r=$('stage').getBoundingClientRect();const n=Math.max(8,Math.floor((Math.min(r.width,r.height)-2)/8)*8);document.documentElement.style.setProperty('--board-size',n+'px');}
async function getPack(level,collectionId=selectedCollection){
  const key=collectionId+':'+level;
  if(packs.has(key))return packs.get(key);
  const collection=collections.find(c=>c.id===collectionId)||defaultCollection;
  const response=await fetch(new URL('mate-'+level+'.json',new URL(collection.basePath,location.href)),{cache:'no-store'});
  if(!response.ok)throw new Error('Puzzle data could not load ('+response.status+').');
  const data=await response.json();
  if(!Array.isArray(data.puzzles)||!data.puzzles.length)throw new Error('This puzzle level is empty.');
  const ids=new Set();
  for(const p of data.puzzles){
    if(!/^m[1-6]-\d{2,}$/.test(p.id)||ids.has(p.id)||p.mate!==level||!['w','b'].includes(p.attacker))throw new Error('Puzzle data is not valid.');
    const b=new Rules(p.fen);if(b.turn()!==p.attacker||b.isGameOver())throw new Error('Puzzle starting position is not playable.');ids.add(p.id);
  }
  puzzleAliases.set(key,data.aliases||{});packs.set(key,data.puzzles);return data.puzzles;
}
async function loadPuzzle(level,requestedId=null,offset=0){
  const ticket=invalidate();loadLevel=level;setPhase('loading');newClock();setMessage('Loading...');
  $('level').value=String(level);
  try{
    const data=await getPack(level);if(ticket!==version)return;
    let at=requestedId?data.findIndex(p=>p.id===requestedId):((offset%data.length)+data.length)%data.length;
    if(at<0){const alias=puzzleAliases.get(selectedCollection+':'+level)?.[requestedId];at=data.findIndex(p=>p.id===alias);}
    if(at<0)throw new Error('This puzzle link was not found.');
    pack=data;index=at;puzzle=data[index];game=new Rules(puzzle.fen);attackingMoves=0;
    $('instruction').textContent=colour(puzzle.attacker)+' to move. Mate in '+puzzle.mate+'!'+(puzzle.source?.game?' '+puzzle.source.game+(puzzle.source.year?' ('+puzzle.source.year+')':''):'')+(puzzle.source?.trainingContinuation?' · Training continuation':'');
    document.title=colour(puzzle.attacker)+' to move - Mate in '+puzzle.mate;
    $('board').setAttribute('aria-label',colour(puzzle.attacker)+' playing from the bottom. Chess puzzle.');
    renderBoard();sizeBoard();
    try{const u=new URL(location.href);u.searchParams.set('p',puzzle.id);if(selectedCollection==='tournaments')u.searchParams.delete('c');else u.searchParams.set('c',selectedCollection);history.replaceState(null,'',u);}catch(_){/* Some sandbox configurations disallow History API writes. */}
    await engine.ready;if(ticket!==version)return;
    setMessage('');setPhase('human');startClock();
  }catch(e){if(ticket!==version||e.name==='AbortError')return;engineError(e);}
}
function engineError(e){setPhase('error');selected=null;closePromotion();renderBoard();setMessage(e.message||'Unable to load the puzzle.','error');}
function closePromotion(){promotionOptions=null;$('promotion').hidden=true;$('promotion-options').replaceChildren();}
function askPromotion(options){
  promotionOptions=options;$('promotion-options').replaceChildren();
  for(const code of ['q','r','b','n']){const m=options.find(x=>x.promotion===code);if(!m)continue;
    const b=document.createElement('button');b.type='button';b.textContent=NAMES[code][0].toUpperCase()+NAMES[code].slice(1);b.dataset.promotion=code;
    b.addEventListener('click',()=>{if(phase==='human'&&promotionOptions?.includes(m)){closePromotion();humanMove(m);}});$('promotion-options').append(b);
  }
  $('promotion').hidden=false;$('promotion-options').querySelector('button')?.focus();
}
function clickSquare(square){
  if(phase!=='human'||!game||game.turn()!==puzzle.attacker||promotionOptions)return;
  const pc=game.get(square);
  if(selected){
    const moves=game.moves({verbose:true}).filter(m=>m.from===selected&&(m.to===square||m.castleKingTo===square));
    if(moves.length){if(moves.some(m=>m.promotion))askPromotion(moves);else humanMove(moves[0]);return;}
  }
  selected=pc?.color===puzzle.attacker?(selected===square?null:square):null;renderBoard();
}
function actualOutcome(){
  if(game.isCheckmate()){
    if(game.turn()!==puzzle.attacker&&attackingMoves<=puzzle.mate){setPhase('solved');stopClock();setMessage('Correct!','correct');}
    else failAttempt();return true;
  }
  if(game.isGameOver()){failAttempt();return true;}
  return false;
}
function humanMove(move){
  if(phase!=='human')return;
  const legal=game.moves({verbose:true}).find(m=>uci(m)===uci(move));if(!legal)return;
  game.move(legal);attackingMoves++;selected=null;setMessage('');renderBoard();
  if(actualOutcome())return;
  // No early best-move / wrong-move test. Let the user finish the attempt.
  if(attackingMoves>=puzzle.mate){failAttempt();return;}
  defend();
}
async function defend(){
  if(!game||game.turn()===puzzle.attacker)return;
  const ticket=version,fen=game.fen();setPhase('defending');
  try{
    const history=game.history({verbose:true});
    const line=puzzle.defenceLine||puzzle.tournamentLine||[];
    // Verified packs use a best-resistance line; older packs retain their recorded line.
    // Compare the whole prefix: a later transposition does not erase a deviation.
    // Recorded UCI uses king destinations for castling; the engine uses rook squares.
    const onLine=history.every((m,i)=>
      (m.from+(m.castleKingTo||m.to)+(m.promotion||''))===line[i]);
    const recorded=onLine?line[history.length]:null;
    let legal=recorded&&game.moves({verbose:true}).find(m=>
      (m.from+(m.castleKingTo||m.to)+(m.promotion||''))===recorded);
    const move=legal?uci(legal):await engine.search(puzzle.fen,history.map(uci),puzzle.mate);
    if(ticket!==version||phase!=='defending'||game.fen()!==fen)return;
    legal=game.moves({verbose:true}).find(m=>uci(m)===move);
    if(!legal)throw new Error('The engine returned an illegal move. Use Retry.');
    game.move(legal);renderBoard();if(actualOutcome())return;setPhase('human');
  }catch(e){if(ticket!==version||e.name==='AbortError')return;engineError(e);}
}
function failAttempt(){
  setPhase('retry');selected=null;setMessage('Try again','try-again');const ticket=version;
  resetTimer=setTimeout(()=>{
    if(ticket!==version||phase!=='retry')return;
    game=new Rules(puzzle.fen);attackingMoves=0;setPhase('human');renderBoard();
    // Timer deliberately continues, including the visible reset interval.
    feedbackTimer=setTimeout(()=>{if(ticket===version&&phase==='human')setMessage('');},900);
  },850);
}
function undo(){
  if(!game||!game.history().length||phase==='loading')return;
  const wasSolved=phase==='solved';invalidate();
  game.undo();if(game.turn()!==puzzle.attacker&&game.history().length)game.undo();
  attackingMoves=game.history({verbose:true}).filter(m=>m.color===puzzle.attacker).length;
  setPhase('human');renderBoard();if(wasSolved)startClock();
}
$('board').addEventListener('click',e=>{const s=e.target.closest('[data-square]');if(s)clickSquare(s.dataset.square);});
$('collection').addEventListener('change',()=>{selectedCollection=$('collection').value;loadPuzzle(Number($('level').value));});
$('level').addEventListener('change',()=>loadPuzzle(Number($('level').value)));
$('next').addEventListener('click',()=>loadPuzzle(puzzle.mate,null,index+1));
$('undo').addEventListener('click',undo);
$('promotion-cancel').addEventListener('click',closePromotion);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePromotion();selected=null;renderBoard();}});
$('retry').addEventListener('click',async()=>{
  if(phase!=='error')return;
  engine.destroy();engine=new LiteEngine();const ticket=++version;setPhase('loading');setMessage('Loading...');
  try{await engine.ready;if(ticket!==version)return;setMessage('');if(!game){loadPuzzle(loadLevel);return;}startClock();if(game.turn()===puzzle.attacker)setPhase('human');else defend();}catch(e){if(ticket===version)engineError(e);}
});
new ResizeObserver(sizeBoard).observe($('stage'));
window.visualViewport?.addEventListener('resize',sizeBoard);window.addEventListener('resize',sizeBoard);
window.addEventListener('pagehide',()=>engine.cancel());
window.addEventListener('pageshow',event=>{if(event.persisted&&phase==='defending'){version++;defend();}});
setInterval(tick,150);
const initial=new URLSearchParams(location.search).get('p');
const valid=initial&&/^m([1-6])-\d{2,}$/.exec(initial);
loadCollections().then(()=>loadPuzzle(valid?Number(valid[1]):1,valid?initial:null));
})();
